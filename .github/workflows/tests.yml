name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        # PDF output is tested offline; OCR calls are mocked in contract tests.
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install "pdfplumber>=0.11.9,<0.12" "pypdf>=6.10,<7" "pypdfium2>=4.30,<6" "reportlab>=4.4.9,<5"
          python -m unittest discover -s tests -v

  plugin:
    name: plugin · node${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check syntax and run provider tests
        run: |
          node --check lib/index.js
          node --test test/*.test.mjs
